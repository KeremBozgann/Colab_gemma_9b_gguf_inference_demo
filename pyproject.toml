[project]
name = "training-embedding"
version = "0.1.0"
description = "Local utilities for HF-to-GGUF conversion workflows."
readme = "resources.txt"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.24.0,<1.0.0",
  "transformers>=4.45.0,<5.0.0",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "ipykernel>=7.2.0",
  "jupyter>=1.1.1",
  "llama-cpp-python>=0.3.16",
  "fastapi>=0.135.1",
  "uvicorn>=0.41.0",
  "httpx>=0.28.1",
  "pyngrok>=7.5.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
